<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Review - {{ dealer.business_name }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 0;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        nav h1 {
            font-size: 1.5rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .user-welcome {
            color: #ffe;
            font-weight: bold;
            margin-left: 15px;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .back-btn {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .form-card {
            background: white;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
        }

        .form-card h2 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 5px;
        }

        .form-card .subtitle {
            color: #667eea;
            margin-bottom: 25px;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .rating-group {
            display: flex;
            gap: 10px;
        }

        .rating-group input[type=radio] {
            display: none;
        }

        .rating-group label {
            cursor: pointer;
            font-size: 1.8rem;
            color: #ddd;
        }

        .rating-group input[type=radio]:checked~label,
        .rating-group label:hover,
        .rating-group label:hover~label {
            color: #f59e0b;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 14px 35px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <h1><a href="/" style="color:white;text-decoration:none;">Dealership Review</a></h1>
            <div>
                <a href="/about/">About Us</a>
                <a href="/contact/">Contact</a>
                {% if user.is_authenticated %}
                <span class="user-welcome">Welcome, {{ user.username }}</span>
                <a href="/logout/">Logout</a>
                {% else %}
                <a href="/login/">Sign In</a>
                {% endif %}
            </div>
        </nav>
    </header>
    <div class="container">
        <a href="/dealer/{{ dealer.id }}/" class="back-btn">← Back to {{ dealer.business_name }}</a>
        <div class="form-card">
            <h2>Post a Review</h2>
            <p class="subtitle">{{ dealer.business_name }} — {{ dealer.city }}, {{ dealer.state }}</p>
            <form method="POST" action="/dealer/{{ dealer.id }}/add_review/">
                {% csrf_token %}
                <div class="form-group">
                    <label for="review">Your Review *</label>
                    <textarea id="review" name="review" placeholder="Share your experience with this dealership..."
                        required></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="purchase_date">Purchase Date</label>
                        <input type="date" id="purchase_date" name="purchase_date">
                    </div>
                    <div class="form-group">
                        <label for="rating">Rating *</label>
                        <select id="rating" name="rating" required>
                            <option value="">Select rating...</option>
                            <option value="5">★★★★★ (5) Excellent</option>
                            <option value="4">★★★★☆ (4) Good</option>
                            <option value="3">★★★☆☆ (3) Average</option>
                            <option value="2">★★☆☆☆ (2) Poor</option>
                            <option value="1">★☆☆☆☆ (1) Terrible</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="car_make">Car Make</label>
                        <select id="car_make" name="car_make">
                            <option value="">Select make...</option>
                            {% for make in car_makes %}
                            <option value="{{ make.name }}">{{ make.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="car_model">Car Model</label>
                        <select id="car_model" name="car_model">
                            <option value="">Select model...</option>
                            {% for model in car_models %}
                            <option value="{{ model.name }}">{{ model.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="car_year">Car Year</label>
                    <input type="number" id="car_year" name="car_year" min="2000" max="2026" placeholder="e.g. 2022">
                </div>
                <button type="submit" class="btn-submit">Post Review</button>
            </form>
        </div>
    </div>
</body>

</html>
